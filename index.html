<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07020f">
  <meta name="description" content="A Message From The Universe — receive a message for today.">

  <title>A Message From The Universe</title>

  <!-- Existing visual system -->
  <link rel="stylesheet" href="style.css">

  <!-- Fonts used by the existing app -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ======================================================
       UNIVERSE139 - TRUE FULL-SCREEN VIDEO BACKGROUND
       ====================================================== */

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #05020a;
      overflow-x: hidden;
    }

    body {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
    }

    #backgroundVideo {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      display: block !important;
      object-fit: cover !important;
      object-position: center center !important;
      background: #05020a !important;
      z-index: 0 !important;
      pointer-events: none !important;
      opacity: 1 !important;
    }

    #universe139VideoOverlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(5, 2, 16, 0.18),
          rgba(5, 2, 16, 0.08) 45%,
          rgba(5, 2, 16, 0.26) 100%
        );
    }

    .stars {
      z-index: 2 !important;
      pointer-events: none !important;
    }

    .container {
      position: relative !important;
      z-index: 3 !important;
    }

    /* ======================================================
       TOP CONTROLS - kept outside the message card
       ====================================================== */

    #universe139TopControls {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 9px;
      pointer-events: none;
    }

    #universe139TopControls > * {
      pointer-events: auto;
    }

    #universe139TopControls button {
      border: 1px solid rgba(255,255,255,.20);
      background: rgba(18, 7, 35, .58);
      color: #fff;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 28px rgba(0,0,0,.20);
    }

    #universe139TopControls .hidden {
      display: none !important;
    }

    /* ======================================================
       SMALLER MESSAGE TEXT
       ====================================================== */

    #messageBox {
      position: relative;
      z-index: 6;
      width: min(430px, calc(100vw - 34px));
    }

    #message {
      font-family: 'Cinzel', serif;
      font-size: clamp(17px, 1.7vw, 20px) !important;
      line-height: 1.48 !important;
      max-width: 350px !important;
      margin: 0 auto 18px !important;
    }

    #againBtn {
      position: fixed;
      left: max(18px, env(safe-area-inset-left));
      top: 118px;
      z-index: 20;
    }

    #shareBtn {
      display: inline-flex;
      position: relative;
      z-index: 8;
    }

    /* ======================================================
       DYNAMIC SUBSCRIPTION BOX
       The existing script creates this element.
       Move it completely outside the message card.
       ====================================================== */

    #universe139SubscribeBox {
      position: fixed !important;
      left: max(18px, env(safe-area-inset-left)) !important;
      top: 176px !important;
      width: min(280px, calc(100vw - 36px)) !important;
      margin: 0 !important;
      z-index: 20 !important;
      padding: 15px 16px !important;
      border-radius: 18px !important;
      background: rgba(20, 8, 40, .66) !important;
      border: 1px solid rgba(255,255,255,.16) !important;
      box-shadow: 0 15px 45px rgba(0,0,0,.25) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
    }

    #universe139SubscribeBox .universe139SubscribeTitle {
      font-size: 14px !important;
    }

    #universe139SubscribeBox .universe139SubscribeText {
      font-size: 12px !important;
      line-height: 1.45 !important;
    }

    #universe139SubscribeBox .universe139SubscribeButton {
      font-size: 11px !important;
      padding: 9px 14px !important;
    }

    /* ======================================================
       KEEP THE MESSAGE CARD CLEAN
       ====================================================== */

    #messageBox #universe139SubscribeBox {
      position: fixed !important;
      left: max(18px, env(safe-area-inset-left)) !important;
      top: 176px !important;
    }

    /* ======================================================
       MOBILE
       ====================================================== */

    @media (max-width: 600px) {
      #againBtn {
        top: 102px;
        left: max(14px, env(safe-area-inset-left));
      }

      #universe139SubscribeBox,
      #messageBox #universe139SubscribeBox {
        left: max(14px, env(safe-area-inset-left)) !important;
        top: 155px !important;
        width: min(250px, calc(100vw - 28px)) !important;
      }

      #messageBox {
        width: calc(100vw - 28px) !important;
      }

      #message {
        font-size: 17px !important;
        max-width: 320px !important;
      }
    }

    @media (max-width: 380px) {
      #againBtn {
        top: 96px;
      }

      #message {
        font-size: 16px !important;
        max-width: 300px !important;
      }
    }

    /* ======================================================
       MOBILE APP LAYOUT
       - Keep the message card compact
       - Put subscription BELOW the message card
       - Keep video truly full screen
       ====================================================== */

    @media (max-width: 600px) {
      html,
      body {
        min-height: 100%;
        overflow-x: hidden;
      }

      #backgroundVideo {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        min-width: 100vw !important;
        min-height: 100vh !important;
        max-width: none !important;
        max-height: none !important;
        object-fit: cover !important;
        object-position: center center !important;
      }

      .container {
        position: relative !important;
        z-index: 3 !important;
        min-height: 100dvh;
        width: 100%;
        padding: 72px 14px 34px !important;
        overflow: visible;
      }

      header {
        width: 100%;
        max-width: 100%;
      }

      h1 {
        max-width: 94vw;
        margin-left: auto;
        margin-right: auto;
      }

      #messageBox {
        width: calc(100vw - 28px) !important;
        max-width: 500px !important;
        margin-left: auto !important;
        margin-right: auto !important;
        margin-top: 18px !important;
        padding: 24px 16px 20px !important;
      }

      #message {
        font-size: 17px !important;
        line-height: 1.48 !important;
        max-width: 330px !important;
      }

      #smallText {
        font-size: 12px !important;
        line-height: 1.45 !important;
        margin-bottom: 16px !important;
      }

      #shareBtn {
        display: inline-flex !important;
        margin-top: 2px !important;
      }

      /* The subscription is moved here by JS after the box is created. */
      #universe139SubscriptionMount {
        position: relative !important;
        width: calc(100vw - 28px) !important;
        max-width: 500px !important;
        margin: 14px auto 0 !important;
        z-index: 12 !important;
        display: block;
      }

      #universe139SubscriptionMount #universe139SubscribeBox {
        position: relative !important;
        inset: auto !important;
        left: auto !important;
        top: auto !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 14px 14px 15px !important;
        border-radius: 18px !important;
        background: rgba(20, 8, 40, .72) !important;
        backdrop-filter: blur(14px) !important;
        -webkit-backdrop-filter: blur(14px) !important;
      }

      #universe139SubscriptionMount .universe139SubscribeTitle {
        font-size: 15px !important;
        line-height: 1.35 !important;
      }

      #universe139SubscriptionMount .universe139SubscribeText {
        font-size: 12px !important;
        line-height: 1.45 !important;
        margin-top: 5px !important;
      }

      #universe139SubscriptionMount .universe139SubscribeButton {
        min-height: 40px !important;
        margin-top: 10px !important;
        padding: 8px 18px !important;
        font-size: 12px !important;
      }

      /* Never leave the subscription floating over the message on mobile. */
      #messageBox > #universe139SubscribeBox {
        position: static !important;
        display: none !important;
      }
    }

    @media (max-width: 380px) {
      .container {
        padding-left: 11px !important;
        padding-right: 11px !important;
      }

      #messageBox,
      #universe139SubscriptionMount {
        width: calc(100vw - 22px) !important;
      }

      #message {
        font-size: 16px !important;
        max-width: 300px !important;
      }
    }

    /* ======================================================
       REDUCE MOTION
       ====================================================== */

    @media (prefers-reduced-motion: reduce) {
      #backgroundVideo {
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- ====================================================
       TRUE MOVING BACKGROUND VIDEO
       IMPORTANT:
       - autoplay: starts automatically
       - muted: required for autoplay in modern browsers
       - loop: repeats continuously
       - playsinline: keeps video inline on mobile
       ==================================================== -->
  <video
    id="backgroundVideo"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline="true"
    preload="auto"
    aria-hidden="true"
  >
    <source src="universe-background.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <div id="universe139VideoOverlay" aria-hidden="true"></div>

  <!-- Existing animated stars layer -->
  <div class="stars" aria-hidden="true"></div>

  <!-- ====================================================
       TOP-LEFT CONTROLS
       ==================================================== -->
  <div id="universe139TopControls" aria-label="Universe controls">
    <!-- Receive Another Message is also moved here visually.
         The real #againBtn is styled into this position. -->
  </div>

  <!-- ====================================================
       MAIN APPLICATION
       ==================================================== -->
  <main class="container">

    <!-- Language selection -->
    <section id="languageBox" aria-label="Language selection">
      <div id="chooseLanguage">Choose your language</div>

      <div class="languageGrid" role="group" aria-label="Choose language">
        <button class="languageBtn" data-language="en" type="button">English</button>
        <button class="languageBtn" data-language="es" type="button">Español</button>
        <button class="languageBtn" data-language="zh" type="button">中文</button>
        <button class="languageBtn" data-language="ru" type="button">Русский</button>
        <button class="languageBtn" data-language="hi" type="button">हिन्दी</button>
        <button class="languageBtn" data-language="th" type="button">ไทย</button>
      </div>
    </section>

    <!-- Main title -->
    <header>
      <div class="moon" aria-hidden="true">✦</div>

      <h1 id="title">A Message From The Universe</h1>

      <div id="subtitle" class="subtitle">
        Your message is waiting...
      </div>
    </header>

    <!-- Existing crystal-ball loading/reveal area -->
    <section
      id="crystalBallWrap"
      class="hidden"
      aria-hidden="true"
    >
      <div id="ballHurricane" aria-hidden="true"></div>
    </section>

    <!-- Loading -->
    <section id="loading" class="hidden" aria-live="polite">
      <div id="loadingText">
        The Universe is preparing your message...
      </div>
    </section>

    <!-- Reveal button -->
    <button
      id="revealBtn"
      type="button"
    >
      Reveal My Message
    </button>

    <!-- ==================================================
         MESSAGE CARD
         Only the message + Share remain here.
         Subscribe is removed from the card by JS/CSS.
         Receive Another Message is moved to the left side.
         ================================================== -->
    <article
      id="messageBox"
      class="message-box hidden"
      aria-live="polite"
    >
      <div id="month" class="month">Your Message</div>

      <div id="message" role="status"></div>

      <div id="smallText" class="small-text">
        Keep this message close to your heart.
      </div>

      <!-- Only Share remains directly under the message -->
      <button
        id="shareBtn"
        type="button"
      >
        Share My Message
      </button>
    </article>

    <!-- Existing second-message control.
         CSS moves this visually to the top-left area. -->
    <button
      id="againBtn"
      class="hidden"
      type="button"
    >
      Receive Another Message
    </button>

    <!-- Existing dynamic subscription system uses this variable.
         JavaScript creates the actual subscription panel. -->
    <div id="universe139SubscriptionMount" aria-hidden="true"></div>

  </main>

  <!-- ====================================================
       BACKGROUND VIDEO PLAYBACK SAFETY
       ==================================================== -->
  <script>
    (function () {
      const video = document.getElementById("backgroundVideo");

      if (!video) {
        return;
      }

      video.muted = true;
      video.defaultMuted = true;
      video.loop = true;
      video.playsInline = true;

      function startBackgroundVideo() {
        const promise = video.play();

        if (promise && typeof promise.catch === "function") {
          promise.catch(function (error) {
            console.warn(
              "Universe139 background video autoplay was blocked:",
              error
            );
          });
        }
      }

      if (video.readyState >= 2) {
        startBackgroundVideo();
      } else {
        video.addEventListener(
          "loadeddata",
          startBackgroundVideo,
          { once: true }
        );
      }

      video.addEventListener(
        "canplay",
        startBackgroundVideo,
        { once: true }
      );

      document.addEventListener(
        "visibilitychange",
        function () {
          if (!document.hidden) {
            startBackgroundVideo();
          }
        }
      );

    })();
  </script>

  <!-- Mobile playback reliability -->
  <script>
    (function () {
      const video = document.getElementById("backgroundVideo");
      if (!video) return;

      video.muted = true;
      video.defaultMuted = true;
      video.autoplay = true;
      video.loop = true;
      video.playsInline = true;

      function tryPlay() {
        if (document.hidden) return;
        try {
          const result = video.play();
          if (result && typeof result.catch === "function") {
            result.catch(function () {});
          }
        } catch (e) {
          // Browser may require a gesture; listeners below retry.
        }
      }

      tryPlay();
      video.addEventListener("loadedmetadata", tryPlay, { once: true });
      video.addEventListener("loadeddata", tryPlay, { once: true });
      video.addEventListener("canplay", tryPlay, { once: true });
      window.addEventListener("pageshow", tryPlay);
      window.addEventListener("focus", tryPlay);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) tryPlay();
      });

      ["touchstart", "pointerdown", "click"].forEach(function (eventName) {
        document.addEventListener(eventName, tryPlay, {
          passive: true
        });
      });
    })();
  </script>

  <!-- Move the dynamically-created subscription outside the message card on mobile -->
  <script>
    (function () {
      const mount = document.getElementById("universe139SubscriptionMount");
      if (!mount) return;

      function moveSubscriptionForMobile() {
        const box = document.getElementById("universe139SubscribeBox");
        if (!box) return;

        if (window.matchMedia("(max-width: 600px)").matches) {
          if (box.parentElement !== mount) {
            mount.appendChild(box);
          }
        }
      }

      const observer = new MutationObserver(moveSubscriptionForMobile);
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });

      moveSubscriptionForMobile();
      window.addEventListener("resize", moveSubscriptionForMobile);
    })();
  </script>

  <!-- Existing application logic -->
  <script src="script.js"></script>

</body>
</html>
