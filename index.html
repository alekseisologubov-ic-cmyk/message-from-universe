<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Universe139 — A message from the universe for today."
  >

  <meta
    name="theme-color"
    content="#080512"
  >

  <title>
    Universe139 — Message From The Universe
  </title>


  <!-- Vercel Web Analytics -->

  <script>

    window.va =
      window.va ||
      function () {

        (window.vaq =
          window.vaq ||
          []
        ).push(arguments);

      };

  </script>


  <script
    defer
    src="/_vercel/insights/script.js"
  ></script>


  <style>

    * {

      box-sizing:
        border-box;

      margin:
        0;

      padding:
        0;

    }


    html,
    body {

      width:
        100%;

      min-height:
        100%;

    }


    body {

      min-height:
        100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color:
        white;


      display:
        flex;

      justify-content:
        center;

      align-items:
        center;


      overflow-x:
        hidden;


      /*
        Fallback background.
        The video sits behind everything.
      */

      background:
        radial-gradient(
          circle at 50% 10%,
          #4b3470 0%,
          #261541 28%,
          #11091e 58%,
          #050309 100%
        );


      position:
        relative;

    }


    /* =====================================================
       UNIVERSE139 VIDEO BACKGROUND
       ===================================================== */

    #universeBackgroundVideo {

      position:
        fixed;

      inset:
        0;


      width:
        100%;

      height:
        100%;


      object-fit:
        cover;


      object-position:
        center center;


      z-index:
        0;


      pointer-events:
        none;


      background:
        #050309;

    }


    /*
      Dark translucent layer above the video.
      This keeps your existing text and buttons readable
      without changing their design.
    */

    #universeBackgroundOverlay {

      position:
        fixed;

      inset:
        0;


      width:
        100%;

      height:
        100%;


      z-index:
        1;


      pointer-events:
        none;


      background:
        rgba(4, 1, 15, 0.42);

    }


    .stars {

      position:
        fixed;

      inset:
        0;

      pointer-events:
        none;

      opacity:
        0.45;


      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,0.8) 1px,
          transparent 1.5px
        );


      background-size:
        75px 75px;


      /*
        Stars remain above the video but below
        the actual app content.
      */

      z-index:
        2;

    }


    .container {

      width:
        100%;

      max-width:
        760px;

      min-height:
        100vh;


      padding:
        35px 20px;


      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;


      text-align:
        center;


      position:
        relative;


      /*
        Above:
        video
        overlay
        stars
      */

      z-index:
        3;

    }


    .logo {

      font-size:
        13px;

      letter-spacing:
        7px;

      text-transform:
        uppercase;

      opacity:
        0.55;

      margin-bottom:
        22px;

    }


    #title {

      font-size:
        clamp(38px, 8vw, 68px);

      line-height:
        1.05;

      letter-spacing:
        3px;

      font-weight:
        700;

      margin-bottom:
        18px;

    }


    #subtitle {

      font-size:
        18px;

      line-height:
        1.5;

      opacity:
        0.75;

      margin-bottom:
        35px;

    }


    #languageBox {

      width:
        100%;

      max-width:
        650px;


      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);


      justify-items:
        center;

      align-items:
        center;


      column-gap:
        20px;

      row-gap:
        20px;


      margin-bottom:
        20px;

    }


    #chooseLanguage {

      grid-column:
        1 / -1;


      font-size:
        14px;

      letter-spacing:
        2px;

      text-transform:
        uppercase;


      opacity:
        0.55;

    }


    /*
      Wraps each diamond button. A square rotated 45°
      has a visual footprint larger than its layout box.
      This wrapper reserves that footprint so the diamonds
      do not overlap.
    */

    .diamondSlot {

      width:
        198px;

      height:
        198px;


      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

    }


    .languageBtn {

      width:
        140px;

      height:
        140px;


      border:
        1px solid
        rgba(255,255,255,0.35);

      border-radius:
        18px;


      cursor:
        pointer;

      color:
        white;


      display:
        flex;

      justify-content:
        center;

      align-items:
        center;


      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.23),
          rgba(170,110,255,0.10) 45%,
          rgba(255,255,255,0.035)
        );


      backdrop-filter:
        blur(8px);


      box-shadow:
        inset
        0 1px 4px
        rgba(255,255,255,0.55),

        inset
        0 -3px 8px
        rgba(0,0,0,0.25),

        0 15px 35px
        rgba(0,0,0,0.35);


      transform:
        rotate(45deg);

    }


    .diamondContent {

      transform:
        rotate(-45deg);


      width:
        100%;

      height:
        100%;


      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

    }


    .flag {

      display:
        block;

      font-size:
        30px;

      margin-bottom:
        7px;

    }


    .languageName {

      font-size:
        15px;

      font-weight:
        600;

    }


    #revealBtn {

      border:
        none;

      border-radius:
        50px;


      padding:
        16px 32px;


      font-size:
        16px;

      font-weight:
        700;


      color:
        white;

      cursor:
        pointer;


      background:
        linear-gradient(
          135deg,
          #b276ff,
          #6934c9
        );


      box-shadow:
        0 10px 30px
        rgba(120,60,255,0.4);

    }


    #loading {

      margin-top:
        25px;

    }


    #loadingText {

      font-size:
        18px;

      opacity:
        0.8;

    }


    #messageBox {

      width:
        100%;

      max-width:
        620px;


      padding:
        40px 28px;


      border-radius:
        30px;


      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.13),
          rgba(255,255,255,0.04)
        );


      border:
        1px solid
        rgba(255,255,255,0.2);


      backdrop-filter:
        blur(14px);


      box-shadow:
        inset
        0 1px 3px
        rgba(255,255,255,0.35),

        0 20px 55px
        rgba(0,0,0,0.4);

    }


    #month {

      font-size:
        13px;

      letter-spacing:
        2px;

      opacity:
        0.58;

      margin-bottom:
        25px;

    }


    #message {

      font-size:
        clamp(24px, 5vw, 36px);

      line-height:
        1.45;

      font-weight:
        500;

      margin-bottom:
        30px;

    }


    #smallText {

      font-size:
        14px;

      opacity:
        0.52;

      margin-bottom:
        25px;

    }


    .buttons {

      display:
        flex;

      flex-direction:
        column;

      gap:
        12px;

      align-items:
        center;

    }


    #againBtn,
    #shareBtn {

      border:
        none;

      border-radius:
        50px;


      padding:
        14px 26px;


      font-size:
        15px;

      font-weight:
        700;


      color:
        white;

      cursor:
        pointer;

    }


    #againBtn {

      background:
        linear-gradient(
          135deg,
          #a968ff,
          #6731c7
        );

    }


    #shareBtn {

      background:
        rgba(255,255,255,0.09);

      border:
        1px solid
        rgba(255,255,255,0.18);

    }


    /*
      IMPORTANT
      Keep this exactly.
    */

    .hidden {

      display:
        none !important;

    }


    @media (max-width: 650px) {

      .container {

        padding:
          30px 15px;

      }


      #title {

        font-size:
          clamp(32px, 10vw, 46px);

        letter-spacing:
          0.5px;

      }


      #languageBox {

        grid-template-columns:
          repeat(2, 1fr);

        column-gap:
          12px;

        row-gap:
          12px;

      }


      .diamondSlot {

        width:
          172px;

        height:
          172px;

      }


      .languageBtn {

        width:
          120px;

        height:
          120px;

      }


      #messageBox {

        padding:
          32px 18px;

      }


      #message {

        font-size:
          24px;

      }

    }


    /*
      Phones (portrait)
      A fixed 172px diamond slot doesn't fit
      two per row below approximately 430px.
    */

    @media (max-width: 430px) {

      #languageBox {

        grid-template-columns:
          1fr;

      }

    }


    /*
      =====================================================
      VIDEO MOBILE ADJUSTMENT
      =====================================================
    */

    @media (max-width: 768px) {

      #universeBackgroundVideo {

        object-position:
          center center;

      }

    }


    /*
      =====================================================
      VIDEO FALLBACK
      =====================================================
      If the video fails to load, the original
      background remains underneath it.
    */

    #universeBackgroundVideo:not(:defined) {

      display:
        none;

    }

  </style>

</head>


<body>


  <!-- ===================================================
       UNIVERSE139 VIDEO BACKGROUND
       =================================================== -->

  <video
    id="universeBackgroundVideo"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    aria-hidden="true"
  >

    <source
      src="/universe-background.mp4"
      type="video/mp4"
    >

  </video>


  <!-- Dark readability overlay -->

  <div
    id="universeBackgroundOverlay"
    aria-hidden="true"
  ></div>


  <!-- Existing star layer -->

  <div
    class="stars"
    aria-hidden="true"
  ></div>


  <!-- ===================================================
       EXISTING UNIVERSE139 APP
       =================================================== -->

  <main class="container">


    <div class="logo">

      Universe139

    </div>


    <h1 id="title">

      MESSAGE FROM<br>
      THE UNIVERSE

    </h1>


    <p id="subtitle">

      You were guided here for a reason.

    </p>


    <div id="languageBox">


      <div id="chooseLanguage">

        Choose your language

      </div>


      <div class="diamondSlot">

        <button
          class="languageBtn"
          data-language="en"
          type="button"
        >

          <div class="diamondContent">

            <span class="flag">
              🇺🇸
            </span>

            <span class="languageName">
              English
            </span>

          </div>

        </button>

      </div>


      <div class="diamondSlot">

        <button
          class="languageBtn"
          data-language="es"
          type="button"
        >

          <div class="diamondContent">

            <span class="flag">
              🇪🇸
            </span>

            <span class="languageName">
              Español
            </span>

          </div>

        </button>

      </div>


      <div class="diamondSlot">

        <button
          class="languageBtn"
          data-language="zh"
          type="button"
        >

          <div class="diamondContent">

            <span class="flag">
              🇨🇳
            </span>

            <span class="languageName">
              中文
            </span>

          </div>

        </button>

      </div>


      <div class="diamondSlot">

        <button
          class="languageBtn"
          data-language="ru"
          type="button"
        >

          <div class="diamondContent">

            <span class="flag">
              🇷🇺
            </span>

            <span class="languageName">
              Русский
            </span>

          </div>

        </button>

      </div>


      <div class="diamondSlot">

        <button
          class="languageBtn"
          data-language="hi"
          type="button"
        >

          <div class="diamondContent">

            <span class="flag">
              🇮🇳
            </span>

            <span class="languageName">
              हिन्दी
            </span>

          </div>

        </button>

      </div>


      <div class="diamondSlot">

        <button
          class="languageBtn"
          data-language="th"
          type="button"
        >

          <div class="diamondContent">

            <span class="flag">
              🇹🇭
            </span>

            <span class="languageName">
              ไทย
            </span>

          </div>

        </button>

      </div>


    </div>


    <button
      id="revealBtn"
      class="hidden"
      type="button"
    >

      ✨ REVEAL MY MESSAGE

    </button>


    <div
      id="loading"
      class="hidden"
    >

      <div id="loadingText">

        Connecting to the universe...

      </div>

    </div>


    <section
      id="messageBox"
      class="hidden"
    >


      <div id="month">

        YOUR MESSAGE FOR TODAY

      </div>


      <div id="message"></div>


      <div id="smallText">

        Keep this message close to your heart.

      </div>


      <div class="buttons">


        <button
          id="againBtn"
          type="button"
        >

          🔮 RECEIVE ANOTHER MESSAGE

        </button>


        <button
          id="shareBtn"
          type="button"
        >

          ✨ SHARE

        </button>


      </div>


    </section>


  </main>


  <!-- Existing application script -->

  <script src="script.js"></script>


  <!-- ===================================================
       VIDEO PLAYBACK SAFETY
       =================================================== -->

  <script>

    (function () {

      const video =
        document.getElementById(
          "universeBackgroundVideo"
        );


      if (!video) {
        return;
      }


      video.muted =
        true;


      video.defaultMuted =
        true;


      video.playsInline =
        true;


      /*
        Some mobile browsers may pause
        autoplay after page load.
        Try playback again without
        interfering with the rest of
        the application.
      */

      const playVideo =
        () => {

          const promise =
            video.play();


          if (
            promise &&
            typeof promise.catch ===
              "function"
          ) {

            promise.catch(
              () => {
                // Browser blocked autoplay.
                // User interaction will normally
                // allow playback later.
              }
            );

          }

        };


      playVideo();


      document.addEventListener(
        "visibilitychange",
        () => {

          if (
            !document.hidden
          ) {

            playVideo();

          }

        }
      );


      /*
        Make sure the video stays behind
        the application when the browser
        changes stacking contexts.
      */

      video.style.zIndex =
        "0";

    })();

  </script>


</body>

</html>
