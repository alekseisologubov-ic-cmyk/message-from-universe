    /* =====================================================
       UNIVERSE139 VIDEO BACKGROUND
       ===================================================== */

    #universeBackgroundVideo {

      position:

      left:
        50%;

      width:

      height:
        100vh;

      transform:

        contain;


      object-position:
        center center;


      z-index:

        none;

    /*
      Dark translucent layer above the video.
      This keeps your existing text and buttons readable

    */

    #universeBackgroundOverlay {

      position:

      inset:

      width:

      height:
        92%;


      z-index:
        1;


      pointer-events:
        none;


      background:
        rgba(4, 1, 15, 0.42);

    }


    .stars {

      position:
        fixed;

      inset:
        0;

      pointer-events:
        none;

      opacity:
        0.45;


      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,0.8) 1px,
          transparent 1.5px
        );


      background-size:
        75px 75px;


      /*
        Stars remain above the video but below
        the actual app content.
      */

        2;

    }


    .container {

      width:
        100%;

      max-width:
        760px;

      min-height:
        100vh;


      padding:
        35px 20px;


      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;


      text-align:
        center;

        relative;


      /*
        Above:
        video
        overlay

      */

    .logo {

      letter-spacing:
        7px;

      text-transform:
        uppercase;

      opacity:

      margin-bottom:
        22px;

    #title {

      font-size:
        clamp(38px, 8vw, 68px);

      line-height:
        1.05;

      letter-spacing:
        3px;

      font-weight:
        700;

      margin-bottom:
        18px;

    }


    #subtitle {

      font-size:
        18px;

      line-height:
        1.5;

      opacity:
        0.75;

      margin-bottom:
        35px;

    }


    #languageBox {

      width:
        100%;

      max-width:
        650px;


      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);


      justify-items:
        center;

      align-items:
        center;


      column-gap:
        20px;

      row-gap:
        20px;


      margin-bottom:
        20px;

    }


    #chooseLanguage {

      grid-column:
        1 / -1;


      font-size:
        14px;

      letter-spacing:
        2px;

      text-transform:
        uppercase;


      opacity:
        0.55;

    }


    /*
      Wraps each diamond button. A square rotated 45°
      has a visual footprint larger than its layout box.
      This wrapper reserves that footprint so the diamonds
      do not overlap.
    */

    .diamondSlot {

      width:
        198px;

      height:
        198px;


      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

    }


    .languageBtn {

      width:
        140px;

      height:
        140px;


      border:
        1px solid
        rgba(255,255,255,0.35);

      border-radius:
        18px;


      cursor:
        pointer;

      color:
        white;


      display:
        flex;

      justify-content:
        center;

      align-items:
        center;


      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.23),
          rgba(170,110,255,0.10) 45%,
          rgba(255,255,255,0.035)
        );


      backdrop-filter:
        blur(8px);


      box-shadow:
        inset
        0 1px 4px
        rgba(255,255,255,0.55),

        inset
        0 -3px 8px
        rgba(0,0,0,0.25),

        0 15px 35px
        rgba(0,0,0,0.35);


      transform:
        rotate(45deg);

    }


    .diamondContent {

      transform:
        rotate(-45deg);


      width:
        100%;

      height:
        100%;


      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

    }


    .flag {

      display:
        block;

      font-size:
        30px;

      margin-bottom:
        7px;

    }


    .languageName {

      font-size:
        15px;

      font-weight:
        600;

    }


    #revealBtn {

        none;

      border-radius:
        50px;


      padding:
        16px 32px;


      font-size:
        16px;

      font-weight:
        700;


      color:
        white;

      cursor:
        pointer;

        linear-gradient(
          135deg,
          #b276ff,
          #6934c9
        );


      box-shadow:
        0 10px 30px

    }


    #loading {

      margin-top:
        25px;

    }

    }


    #messageBox {

        100%;

      padding:

        30px;


      background:

          rgba(255,255,255,0.13),

      border:

      backdrop-filter:

    #month {

      letter-spacing:

      margin-bottom:

    #message {

      line-height:
        1.45;

      font-weight:
        500;

      margin-bottom:
        30px;

    }


    #smallText {

      font-size:
        14px;

      opacity:
        0.52;

      margin-bottom:
        25px;

    }


    .buttons {

      display:
        flex;

      flex-direction:
        column;

      gap:
        12px;

      align-items:

    }


    #againBtn,

      border-radius:

      font-size:

      font-weight:

        white;

      cursor:

          #a968ff,

    }


    #shareBtn {

    /*
      IMPORTANT

    */

    .hidden {

      display:

    }

      Phones (portrait)
      A fixed 172px diamond slot doesn't fit
      two per row below approximately 430px.
    */

    @media (max-width: 430px) {

      #languageBox {

        grid-template-columns:
          1fr;

      }

    }

      =====================================================
      VIDEO MOBILE ADJUSTMENT
      =====================================================

    @media (max-width: 768px) {

      #universeBackgroundVideo {

        object-position:
          center center;

      }

    }


    /*
      =====================================================
      VIDEO FALLBACK
      =====================================================
      If the video fails to load, the original
      background remains underneath it.
    */

    #universeBackgroundVideo:not(:defined) {

      display:
        none;

    }



    /* ==========================================================
       UNIVERSE139 DYNAMIC MESSAGE EFFECTS
       ========================================================== */

    #universeMessageEffect {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      opacity: 1;
    }

    /* ==========================================================
       MONEY / WEALTH EFFECT
       ========================================================== */

    #moneyRain {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 0;
      transition: opacity .8s ease;
    }

    .moneyItem {
      position: absolute;
      top: -12vh;
      width: 34px;
      height: 18px;
      border-radius: 50%;
      background:
        radial-gradient(
          ellipse at center,
          rgba(255,245,160,1) 0%,
          rgba(255,207,55,.95) 45%,
          rgba(185,120,15,.9) 100%
        );
      box-shadow:
        0 0 10px rgba(255,215,70,.9),
        0 0 24px rgba(255,190,30,.45);
      animation: moneyFall linear forwards;
      opacity: 0;
      will-change: transform, opacity;
    }

    .moneyItem::before {
      content: "$";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: rgba(100,60,0,.9);
    }

    @keyframes moneyFall {
      0% {
        transform: translateY(-15vh) translateX(0) rotate(0deg) scale(.7);
        opacity: 0;
      }

      10% {
        opacity: .95;
      }

      50% {
        transform: translateY(55vh) translateX(35px) rotate(180deg) scale(1);
      }

      100% {
        transform: translateY(120vh) translateX(-45px) rotate(420deg) scale(.75);
        opacity: 0;
      }
    }

    /* ==========================================================
       PLANET EFFECT
       ========================================================== */

    #planetEffect {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .planet {
      position: relative;
      width: min(42vw, 390px);
      height: min(42vw, 390px);
      min-width: 230px;
      min-height: 230px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 32% 28%,
          rgba(255,255,255,.55) 0%,
          rgba(150,130,220,.38) 12%,
          rgba(70,40,140,.55) 34%,
          rgba(20,12,55,.96) 72%,
          rgba(3,2,10,1) 100%
        );
      box-shadow:
        0 0 35px rgba(175,120,255,.55),
        0 0 100px rgba(110,55,255,.35),
        0 0 190px rgba(75,30,180,.22);
      animation: planetFloat 7s ease-in-out infinite;
      overflow: hidden;
      will-change: transform;
    }

    .planetSurface {
      position: absolute;
      inset: -15%;
      border-radius: 50%;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 16px,
          rgba(180,145,255,.12) 18px,
          transparent 28px
        );
      animation: planetRotate 12s linear infinite;
      opacity: .7;
      will-change: transform;
    }

    .planetAtmosphere {
      position: absolute;
      inset: -8%;
      border-radius: 50%;
      border: 2px solid rgba(205,170,255,.35);
      box-shadow:
        inset 0 0 35px rgba(180,120,255,.35),
        0 0 30px rgba(190,130,255,.35);
      pointer-events: none;
    }

    .planetGlow {
      position: absolute;
      inset: -30%;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          rgba(190,130,255,.18) 0%,
          rgba(110,50,220,.12) 35%,
          transparent 70%
        );
      animation: planetGlowPulse 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes planetRotate {
      0% {
        transform: translateX(-10%);
      }

      50% {
        transform: translateX(10%);
      }

      100% {
        transform: translateX(-10%);
      }
    }

    @keyframes planetFloat {
      0% {
        transform: translateY(0) scale(.95);
      }

      50% {
        transform: translateY(-12px) scale(1);
      }

      100% {
        transform: translateY(0) scale(.95);
      }
    }

    @keyframes planetGlowPulse {
      0% {
        opacity: .45;
        transform: scale(.9);
      }

      50% {
        opacity: .9;
        transform: scale(1.08);
      }

      100% {
        opacity: .45;
        transform: scale(.9);
      }
    }

    @media (max-width: 600px) {
      .planet {
        width: 250px;
        height: 250px;
        min-width: 250px;
        min-height: 250px;
      }

      .moneyItem {
        width: 27px;
        height: 15px;
      }
    }

  </style>

</head>

  <!-- ===================================================
       VIDEO PLAYBACK SAFETY
       =================================================== -->

  <script>

    (function () {

      const video = document.getElementById("universeBackgroundVideo");
      const revealBtn = document.getElementById("revealBtn");
      const againBtn = document.getElementById("againBtn");
      const messageBox = document.getElementById("messageBox");

      if (!video) return;

      video.muted = true;
      video.defaultMuted = true;
      video.playsInline = true;
      video.autoplay = false;
      video.removeAttribute("autoplay");
      video.pause();
      try { video.currentTime = 0; } catch (_) {}

      function playFromStart() {
        try { video.currentTime = 0; } catch (_) {}
        const promise = video.play();
        if (promise && typeof promise.catch === "function") promise.catch(() => {});
      }

      function pauseVideo() {
        video.pause();
      }

      if (revealBtn) revealBtn.addEventListener("click", playFromStart);
      if (againBtn) againBtn.addEventListener("click", playFromStart);

      if (messageBox) {
        const observer = new MutationObserver(() => {
          if (!messageBox.classList.contains("hidden")) pauseVideo();
        });
        observer.observe(messageBox, { attributes: true, attributeFilter: ["class"] });
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) pauseVideo();
      });

      video.addEventListener("ended", pauseVideo);

    })();

  </script>
