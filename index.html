<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Universe139 — A message from the universe for today."
  >

  <meta
    name="theme-color"
    content="#080512"
  >

  <title>Universe139 — Message From The Universe</title>


  <style>

    /* =========================================
       RESET
       ========================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    /* =========================================
       BODY
       ========================================= */

    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow-x: hidden;

      background:

        radial-gradient(
          circle at 50% 10%,
          #4b3470 0%,
          #261541 28%,
          #11091e 58%,
          #050309 100%
        );

      position: relative;
    }


    /* =========================================
       SPACE GLOW
       ========================================= */

    body::before {

      content: "";

      position: fixed;

      width: 700px;
      height: 700px;

      top: -320px;
      left: 50%;

      transform:
        translateX(-50%);

      background:

        radial-gradient(
          circle,
          rgba(190,130,255,0.25),
          transparent 68%
        );

      filter: blur(35px);

      pointer-events: none;
    }


    /* =========================================
       STARS
       ========================================= */

    .stars {

      position: fixed;

      inset: 0;

      pointer-events: none;

      opacity: 0.55;

      background-image:

        radial-gradient(
          circle,
          rgba(255,255,255,0.85) 1px,
          transparent 1.5px
        );

      background-size:
        70px 70px;

      animation:
        starsMove 30s linear infinite;
    }


    @keyframes starsMove {

      from {
        transform:
          translateY(0);
      }

      to {
        transform:
          translateY(70px);
      }

    }


    /* =========================================
       MAIN
       ========================================= */

    .container {

      width: 100%;

      max-width: 720px;

      min-height: 100vh;

      padding:
        35px 20px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      position: relative;

      z-index: 2;
    }


    /* =========================================
       LOGO
       ========================================= */

    .logo {

      font-size: 13px;

      letter-spacing: 7px;

      text-transform: uppercase;

      opacity: 0.55;

      margin-bottom: 22px;

      text-shadow:
        0 0 20px
        rgba(210,160,255,0.7);
    }


    /* =========================================
       TITLE
       ========================================= */

    #title {

      font-size:
        clamp(
          38px,
          8vw,
          68px
        );

      line-height: 1.05;

      letter-spacing: 3px;

      font-weight: 700;

      margin-bottom: 18px;

      text-shadow:

        0 0 15px
        rgba(255,255,255,0.35),

        0 0 40px
        rgba(170,100,255,0.45);
    }


    /* =========================================
       SUBTITLE
       ========================================= */

    #subtitle {

      font-size: 18px;

      line-height: 1.5;

      opacity: 0.75;

      margin-bottom: 38px;
    }


    /* =========================================
       LANGUAGE AREA
       ========================================= */

    #languageBox {

      width: 100%;

      max-width: 620px;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      justify-items: center;

      align-items: center;

      column-gap: 25px;

      row-gap: 28px;

      margin-bottom: 25px;
    }


    /* =========================================
       LANGUAGE TITLE
       ========================================= */

    #chooseLanguage {

      grid-column:
        1 / -1;

      font-size: 14px;

      letter-spacing: 2px;

      text-transform: uppercase;

      opacity: 0.55;

      margin-bottom: 5px;
    }


    /* =========================================
       DIAMOND BUTTON
       ========================================= */

    .languageBtn {

      width: 145px;

      height: 145px;

      border: none;

      cursor: pointer;

      color: white;

      position: relative;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,0.25),
          rgba(170,110,255,0.10) 45%,
          rgba(255,255,255,0.04)
        );

      border:

        1px solid
        rgba(255,255,255,0.38);

      backdrop-filter:
        blur(14px);

      -webkit-backdrop-filter:
        blur(14px);

      box-shadow:

        inset
        0 1px 4px
        rgba(255,255,255,0.6),

        inset
        0 -3px 8px
        rgba(0,0,0,0.25),

        0 15px 40px
        rgba(0,0,0,0.35),

        0 0 30px
        rgba(160,90,255,0.15);

      transform:
        rotate(45deg);

      border-radius: 18px;

      transition:
        transform 0.4s ease,
        box-shadow 0.4s ease,
        background 0.4s ease;

      animation:
        diamondFloat 5s ease-in-out infinite;

      overflow: hidden;
    }


    /* =========================================
       DIAMOND CONTENT
       ========================================= */

    .languageBtn .diamondContent {

      transform:
        rotate(-45deg);

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      width: 100%;

      height: 100%;

      position: relative;

      z-index: 5;
    }


    /* =========================================
       FLOATING ANIMATION
       ========================================= */

    @keyframes diamondFloat {

      0%,
      100% {

        transform:
          rotate(45deg)
          translateY(0);

      }

      50% {

        transform:
          rotate(45deg)
          translateY(-12px);

      }

    }


    /* =========================================
       DIFFERENT FLOAT SPEEDS
       ========================================= */

    .languageBtn:nth-of-type(2) {
      animation-delay: -1s;
    }

    .languageBtn:nth-of-type(3) {
      animation-delay: -2s;
    }

    .languageBtn:nth-of-type(4) {
      animation-delay: -3s;
    }

    .languageBtn:nth-of-type(5) {
      animation-delay: -4s;
    }

    .languageBtn:nth-of-type(6) {
      animation-delay: -1.5s;
    }

    .languageBtn:nth-of-type(7) {
      animation-delay: -2.5s;
    }


    /* =========================================
       CRYSTAL SHINE
       ========================================= */

    .languageBtn::before {

      content: "";

      position: absolute;

      width: 220%;

      height: 45px;

      left: -70%;

      top: 35%;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.45),
          transparent
        );

      transform:
        rotate(-45deg);

      opacity: 0.35;

      animation:
        crystalShine 5s ease-in-out infinite;

      pointer-events: none;
    }


    @keyframes crystalShine {

      0% {
        left: -160%;
      }

      55% {
        left: 160%;
      }

      100% {
        left: 160%;
      }

    }


    /* =========================================
       CRYSTAL HIGHLIGHT
       ========================================= */

    .languageBtn::after {

      content: "";

      position: absolute;

      inset: 4px;

      border-radius: 15px;

      background:

        radial-gradient(
          circle at 25% 20%,
          rgba(255,255,255,0.5),
          transparent 25%
        );

      opacity: 0.65;

      pointer-events: none;
    }


    /* =========================================
       FLAG
       ========================================= */

    .flag {

      display: block;

      font-size: 31px;

      margin-bottom: 7px;

      filter:

        drop-shadow(
          0 3px 8px
          rgba(0,0,0,0.35)
        );
    }


    /* =========================================
       LANGUAGE NAME
       ========================================= */

    .languageName {

      font-size: 16px;

      font-weight: 600;

      text-shadow:
        0 2px 8px
        rgba(0,0,0,0.45);
    }


    /* =========================================
       HOVER DIAMOND
       ========================================= */

    .languageBtn:hover {

      transform:
        rotate(45deg)
        translateY(-15px)
        scale(1.08);

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,0.38),
          rgba(180,110,255,0.20),
          rgba(255,255,255,0.08)
        );

      box-shadow:

        inset
        0 1px 5px
        rgba(255,255,255,0.75),

        0 25px 55px
        rgba(0,0,0,0.45),

        0 0 50px
        rgba(185,110,255,0.5);
    }


    .languageBtn:active {

      transform:
        rotate(45deg)
        translateY(-3px)
        scale(1.02);
    }


    /* =========================================
       REVEAL BUTTON
       ========================================= */

    #revealBtn {

      border: none;

      border-radius: 50px;

      padding:
        17px 32px;

      font-size: 16px;

      font-weight: 700;

      color: white;

      cursor: pointer;

      background:

        linear-gradient(
          135deg,
          #b276ff,
          #6934c9
        );

      box-shadow:

        0 12px 35px
        rgba(120,60,255,0.4);

      transition:
        0.3s ease;
    }


    #revealBtn:hover {

      transform:
        translateY(-4px);

      box-shadow:

        0 18px 50px
        rgba(150,80,255,0.55);
    }


    /* =========================================
       LOADING
       ========================================= */

    #loading {

      margin-top: 25px;

      text-align: center;
    }


    #loadingText {

      font-size: 18px;

      opacity: 0.8;

      animation:
        pulse 1.5s infinite;
    }


    @keyframes pulse {

      0% {
        opacity: 0.3;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.3;
      }

    }


    /* =========================================
       MESSAGE BOX
       ========================================= */

    #messageBox {

      width: 100%;

      max-width: 600px;

      padding:
        40px 28px;

      border-radius: 30px;

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,0.14),
          rgba(255,255,255,0.045)
        );

      border:

        1px solid
        rgba(255,255,255,0.22);

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);

      box-shadow:

        inset
        0 1px 3px
        rgba(255,255,255,0.4),

        0 25px 70px
        rgba(0,0,0,0.45),

        0 0 50px
        rgba(150,90,255,0.18);
    }


    /* =========================================
       TODAY LABEL
       ========================================= */

    #month {

      font-size: 13px;

      letter-spacing: 2px;

      opacity: 0.58;

      margin-bottom: 25px;
    }


    /* =========================================
       MESSAGE
       ========================================= */

    #message {

      font-size:
        clamp(
          24px,
          5vw,
          36px
        );

      line-height: 1.45;

      font-weight: 500;

      margin-bottom: 30px;

      text-shadow:
        0 0 18px
        rgba(255,255,255,0.18);
    }


    /* =========================================
       SMALL TEXT
       ========================================= */

    #smallText {

      font-size: 14px;

      opacity: 0.52;

      margin-bottom: 25px;
    }


    /* =========================================
       MESSAGE BUTTONS
       ========================================= */

    .buttons {

      display: flex;

      flex-direction: column;

      gap: 12px;

      align-items: center;
    }


    #againBtn,
    #shareBtn {

      border: none;

      border-radius: 50px;

      padding:
        15px 28px;

      font-size: 15px;

      font-weight: 700;

      color: white;

      cursor: pointer;

      transition:
        0.3s ease;
    }


    #againBtn {

      background:

        linear-gradient(
          135deg,
          #a968ff,
          #6731c7
        );

      box-shadow:

        0 10px 30px
        rgba(120,60,255,0.35);
    }


    #shareBtn {

      background:
        rgba(255,255,255,0.10);

      border:
        1px solid
        rgba(255,255,255,0.20);
    }


    #againBtn:hover,
    #shareBtn:hover {

      transform:
        translateY(-3px);
    }


    /* =========================================
       HIDDEN
       ========================================= */

    .hidden {

      display: none !important;
    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 600px) {

      .container {

        padding:
          30px 15px;
      }


      #title {

        font-size: 40px;

        letter-spacing: 2px;
      }


      #subtitle {

        font-size: 16px;

        margin-bottom: 30px;
      }


      #languageBox {

        grid-template-columns:
          repeat(2, 1fr);

        column-gap: 10px;

        row-gap: 25px;

        max-width: 430px;
      }


      .languageBtn {

        width: 125px;

        height: 125px;
      }


      .flag {

        font-size: 27px;
      }


      .languageName {

        font-size: 14px;
      }


      #messageBox {

        padding:
          32px 18px;
      }


      #message {

        font-size: 24px;
      }

    }


    /* =========================================
       SMALL PHONES
       ========================================= */

    @media (max-width: 350px) {

      .languageBtn {

        width: 110px;

        height: 110px;
      }

      .flag {

        font-size: 24px;
      }

      .languageName {

        font-size: 13px;
      }

    }

  </style>

</head>


<body>


  <div class="stars"></div>


  <main class="container">


    <div class="logo">
      Universe139
    </div>


    <h1 id="title">
      MESSAGE FROM<br>
      THE UNIVERSE
    </h1>


    <p id="subtitle">
      You were guided here for a reason.
    </p>


    <!-- ======================================
         FLOATING CRYSTAL LANGUAGES
         ====================================== -->

    <div id="languageBox">


      <div id="chooseLanguage">
        Choose your language
      </div>


      <!-- ENGLISH -->

      <button
        class="languageBtn"
        data-language="en"
        type="button"
      >

        <div class="diamondContent">

          <span class="flag">
            🇺🇸
          </span>

          <span class="languageName">
            English
          </span>

        </div>

      </button>


      <!-- SPANISH -->

      <button
        class="languageBtn"
        data-language="es"
        type="button"
      >

        <div class="diamondContent">

          <span class="flag">
            🇪🇸
          </span>

          <span class="languageName">
            Español
          </span>

        </div>

      </button>


      <!-- CHINESE -->

      <button
        class="languageBtn"
        data-language="zh"
        type="button"
      >

        <div class="diamondContent">

          <span class="flag">
            🇨🇳
          </span>

          <span class="languageName">
            中文
          </span>

        </div>

      </button>


      <!-- RUSSIAN -->

      <button
        class="languageBtn"
        data-language="ru"
        type="button"
      >

        <div class="diamondContent">

          <span class="flag">
            🇷🇺
          </span>

          <span class="languageName">
            Русский
          </span>

        </div>

      </button>


      <!-- HINDI -->

      <button
        class="languageBtn"
        data-language="hi"
        type="button"
      >

        <div class="diamondContent">

          <span class="flag">
            🇮🇳
          </span>

          <span class="languageName">
            हिन्दी
          </span>

        </div>

      </button>


      <!-- THAI -->

      <button
        class="languageBtn"
        data-language="th"
        type="button"
      >

        <div class="diamondContent">

          <span class="flag">
            🇹🇭
          </span>

          <span class="languageName">
            ไทย
          </span>

        </div>

      </button>


    </div>


    <!-- ======================================
         REVEAL
         ====================================== -->

    <button
      id="revealBtn"
      class="hidden"
      type="button"
    >
      ✨ REVEAL MY MESSAGE
    </button>


    <!-- ======================================
         LOADING
         ====================================== -->

    <div
      id="loading"
      class="hidden"
    >

      <div id="loadingText">
        Connecting to the universe...
      </div>

    </div>


    <!-- ======================================
         MESSAGE
         ====================================== -->

    <section
      id="messageBox"
      class="hidden"
    >

      <div id="month">
        YOUR MESSAGE FOR TODAY
      </div>


      <div id="message">
      </div>


      <div id="smallText">
        Keep this message close to your heart.
      </div>


      <div class="buttons">


        <button
          id="againBtn"
          type="button"
        >
          🔮 RECEIVE ANOTHER MESSAGE
        </button>


        <button
          id="shareBtn"
          type="button"
        >
          ✨ SHARE
        </button>


      </div>

    </section>


  </main>


  <script src="script.js"></script>

</body>

</html>
