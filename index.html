<!DOCTYPE html>

  <title>Universe139 — Message From The Universe</title>


  <style>

    * {

    }

    }


    body {

      min-height: 100vh;

        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 20%,
          #34215c 0%,
          #160d2b 35%,
          #080612 75%
        );

      color: white;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow-x: hidden;
    }


    .container {

      width: 100%;

      max-width: 650px;

      min-height: 100vh;

      padding:
        35px
        20px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;
    }


    .stars {

      position: fixed;

      inset: 0;

      pointer-events: none;

      opacity: 0.7;

      background-image:
        radial-gradient(
          white 1px,
          transparent 1px
        );

      background-size:
        55px 55px;
    }


    #title {

      font-size: clamp(
        36px,
        8vw,
        64px
      );

      line-height: 1.05;

      letter-spacing: 3px;

      font-weight: 700;

      margin-bottom: 20px;

      text-shadow:
        0 0 15px rgba(
          255,
          255,
          255,
          0.35
        ),
        0 0 35px rgba(
          180,
          120,
          255,
          0.4
        );
    }


    #subtitle {

      font-size: 18px;

      opacity: 0.85;

      margin-bottom: 35px;
    }


    #languageBox {

      width: 100%;

      max-width: 420px;

      display: flex;

      flex-direction: column;

      gap: 12px;
    }


    #chooseLanguage {

      font-size: 16px;

      margin-bottom: 5px;

      opacity: 0.75;
    }


    .languageBtn {

      width: 100%;

      padding:
        16px
        20px;

      border: 1px solid
        rgba(
          255,
          255,
          255,
          0.2
        );

      border-radius: 14px;

      background:
        rgba(
          255,
          255,
          255,
          0.08
        );

      color: white;

      font-size: 17px;

      cursor: pointer;

      transition:
        0.25s ease;

      backdrop-filter:
        blur(10px);
    }


    .languageBtn:hover {

      transform:
        translateY(-2px);

      background:
        rgba(
          255,
          255,
          255,
          0.15
        );

      border-color:
        rgba(
          255,
          255,
          255,
          0.45
        );
    }


    #revealBtn,
    #againBtn,
    #shareBtn {

      border: none;

      border-radius: 50px;

      padding:
        17px
        28px;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      color: white;

      background:
        linear-gradient(
          135deg,
          #9b5cff,
          #5b2bbf
        );

      box-shadow:
        0 10px 30px
        rgba(
          120,
          60,
          255,
          0.3
        );

      transition:
        0.25s ease;
    }


    #revealBtn:hover,
    #againBtn:hover,
    #shareBtn:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 15px 40px
        rgba(
          150,
          80,
          255,
          0.45
        );
    }


    #loading {

      margin-top: 25px;
    }


    #loadingText {

      font-size: 18px;

      opacity: 0.8;

      animation:
        pulse 1.5s
        infinite;
    }


    @keyframes pulse {

      0% {
        opacity: 0.3;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.3;
      }

    }


    #messageBox {

      width: 100%;

      max-width: 560px;

      padding: 35px 25px;

      border-radius: 25px;

      background:
        rgba(
          255,
          255,
          255,
          0.08
        );

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.15
        );

      backdrop-filter:
        blur(15px);

      box-shadow:
        0 20px 60px
        rgba(

          0,
          0,

        rgba(

          255,

        );

    #smallText {

      font-size: 14px;

      opacity: 0.55;

      margin-bottom: 25px;
    }


    .buttons {

      display: flex;

      flex-direction: column;

      gap: 12px;

      align-items: center;

          255,

        );

          255,

    .logo {

        letter-spacing: 2px;
      }


      #subtitle {

        font-size: 16px;
      }


      #messageBox {

        padding:
          28px
          18px;
      }


      #message {

        font-size: 24px;
      }

    }

  </style>

</head>

  <div class="stars"></div>


  <main class="container">

      Universe139

      MESSAGE FROM<br>
      THE UNIVERSE
    </h1>


    <p id="subtitle">

    </p>

         ========================================= -->

    <div id="languageBox">


      <div id="chooseLanguage">

      </div>


      <button

         ========================================= -->

    >

      </div>

      </div>


      <div class="buttons">

        </button>

          type="button"

        </button>


      </div>

       JAVASCRIPT
       ========================================= -->

  <script src="script.js"></script>
