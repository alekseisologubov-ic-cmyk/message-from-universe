```html
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Universe139 — Receive a message from the universe."
  >

  <meta
    name="theme-color"
    content="#080612"
  >

  <title>Universe139 — Message From The Universe</title>


  <style>

    /* =========================================
       RESET
       ========================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    /* =========================================
       BODY
       ========================================= */

    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 50% 15%,
          #49306d 0%,
          #24133f 28%,
          #10091d 58%,
          #05030a 100%
        );

      position: relative;
    }


    /* =========================================
       BACKGROUND GLOW
       ========================================= */

    body::before {

      content: "";

      position: fixed;

      width: 600px;
      height: 600px;

      top: -250px;
      left: 50%;

      transform: translateX(-50%);

      background:
        radial-gradient(
          circle,
          rgba(190,130,255,0.22),
          transparent 70%
        );

      filter: blur(30px);

      pointer-events: none;
    }


    /* =========================================
       STARS
       ========================================= */

    .stars {

      position: fixed;

      inset: 0;

      pointer-events: none;

      opacity: 0.55;

      background-image:

        radial-gradient(
          circle,
          rgba(255,255,255,0.8) 1px,
          transparent 1.5px
        );

      background-size:
        65px 65px;

      animation:
        starsMove 25s linear infinite;
    }


    @keyframes starsMove {

      from {
        transform:
          translateY(0);
      }

      to {
        transform:
          translateY(65px);
      }

    }


    /* =========================================
       MAIN CONTAINER
       ========================================= */

    .container {

      width: 100%;

      max-width: 680px;

      min-height: 100vh;

      padding:
        40px 20px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      position: relative;

      z-index: 2;
    }


    /* =========================================
       LOGO
       ========================================= */

    .logo {

      font-size: 13px;

      letter-spacing: 6px;

      text-transform: uppercase;

      opacity: 0.55;

      margin-bottom: 25px;

      text-shadow:
        0 0 15px
        rgba(210,160,255,0.6);
    }


    /* =========================================
       TITLE
       ========================================= */

    #title {

      font-size:
        clamp(
          38px,
          8vw,
          66px
        );

      line-height: 1.05;

      letter-spacing: 3px;

      font-weight: 700;

      margin-bottom: 18px;

      text-shadow:

        0 0 15px
        rgba(255,255,255,0.35),

        0 0 35px
        rgba(170,100,255,0.4);
    }


    /* =========================================
       SUBTITLE
       ========================================= */

    #subtitle {

      font-size: 18px;

      line-height: 1.5;

      opacity: 0.78;

      margin-bottom: 32px;
    }


    /* =========================================
       LANGUAGE AREA
       ========================================= */

    #languageBox {

      width: 100%;

      max-width: 540px;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 18px;

      margin-top: 5px;
    }


    /* =========================================
       CHOOSE LANGUAGE
       ========================================= */

    #chooseLanguage {

      grid-column:
        1 / -1;

      font-size: 15px;

      letter-spacing: 1px;

      opacity: 0.65;

      margin-bottom: 2px;
    }


    /* =========================================
       CRYSTAL LANGUAGE BUTTON
       ========================================= */

    .languageBtn {

      position: relative;

      min-height: 105px;

      border:

        1px solid
        rgba(
          255,
          255,
          255,
          0.30
        );

      border-radius: 28px;

      color: white;

      font-size: 17px;

      font-weight: 600;

      letter-spacing: 0.3px;

      cursor: pointer;

      overflow: hidden;

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,0.22),
          rgba(255,255,255,0.07)
        );

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      box-shadow:

        inset
        0 1px 2px
        rgba(255,255,255,0.55),

        inset
        0 -1px 2px
        rgba(0,0,0,0.18),

        0 15px 35px
        rgba(0,0,0,0.28),

        0 0 25px
        rgba(150,90,255,0.08);

      transition:
        transform 0.35s ease,
        box-shadow 0.35s ease,
        background 0.35s ease;

      animation:
        crystalFloat 5s ease-in-out infinite;
    }


    /* Different floating timing */

    .languageBtn:nth-of-type(2) {
      animation-delay: -1s;
    }

    .languageBtn:nth-of-type(3) {
      animation-delay: -2s;
    }

    .languageBtn:nth-of-type(4) {
      animation-delay: -3s;
    }

    .languageBtn:nth-of-type(5) {
      animation-delay: -4s;
    }

    .languageBtn:nth-of-type(6) {
      animation-delay: -1.5s;
    }


    @keyframes crystalFloat {

      0%,
      100% {
        transform:
          translateY(0);
      }

      50% {
        transform:
          translateY(-5px);
      }

    }


    /* =========================================
       CRYSTAL SHINE
       ========================================= */

    .languageBtn::before {

      content: "";

      position: absolute;

      top: -100%;
      left: -70%;

      width: 220%;
      height: 250%;

      background:

        linear-gradient(
          120deg,
          transparent 38%,
          rgba(255,255,255,0.03) 44%,
          rgba(255,255,255,0.35) 50%,
          rgba(255,255,255,0.03) 56%,
          transparent 63%
        );

      transform:
        rotate(18deg)
        translateX(-30%);

      transition:
        transform 0.8s ease;

      pointer-events: none;
    }


    /* =========================================
       CRYSTAL HIGHLIGHT
       ========================================= */

    .languageBtn::after {

      content: "";

      position: absolute;

      inset: 1px;

      border-radius: 27px;

      background:

        radial-gradient(
          circle at 20% 8%,
          rgba(255,255,255,0.35),
          transparent 27%
        );

      pointer-events: none;
    }


    /* =========================================
       HOVER
       ========================================= */

    .languageBtn:hover {

      transform:
        translateY(-9px)
        scale(1.035);

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,0.30),
          rgba(170,100,255,0.13)
        );

      box-shadow:

        inset
        0 1px 3px
        rgba(255,255,255,0.65),

        0 20px 45px
        rgba(0,0,0,0.35),

        0 0 35px
        rgba(170,100,255,0.28);
    }


    .languageBtn:hover::before {

      transform:
        rotate(18deg)
        translateX(45%);
    }


    .languageBtn:active {

      transform:
        translateY(-2px)
        scale(0.98);
    }


    /* =========================================
       LANGUAGE EMOJI
       ========================================= */

    .languageBtn .flag {

      display: block;

      font-size: 30px;

      margin-bottom: 7px;

      filter:
        drop-shadow(
          0 3px 7px
          rgba(0,0,0,0.25)
        );
    }


    /* =========================================
       REVEAL BUTTON
       ========================================= */

    #revealBtn,
    #againBtn,
    #shareBtn {

      border: none;

      border-radius: 50px;

      padding:
        17px 30px;

      font-size: 16px;

      font-weight: 700;

      color: white;

      cursor: pointer;

      background:

        linear-gradient(
          135deg,
          #a968ff,
          #6731c7
        );

      box-shadow:

        0 12px 35px
        rgba(120,60,255,0.35);

      transition:
        0.3s ease;
    }


    #revealBtn:hover,
    #againBtn:hover,
    #shareBtn:hover {

      transform:
        translateY(-4px);

      box-shadow:

        0 18px 45px
        rgba(140,80,255,0.5);
    }


    /* =========================================
       LOADING
       ========================================= */

    #loading {

      margin-top: 25px;

      text-align: center;
    }


    #loadingText {

      font-size: 18px;

      opacity: 0.8;

      animation:
        pulse 1.5s infinite;
    }


    @keyframes pulse {

      0% {
        opacity: 0.3;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.3;
      }

    }


    /* =========================================
       MESSAGE BOX
       ========================================= */

    #messageBox {

      width: 100%;

      max-width: 570px;

      padding:
        38px 28px;

      border-radius: 30px;

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,0.14),
          rgba(255,255,255,0.045)
        );

      border:

        1px solid
        rgba(
          255,
          255,
          255,
          0.20
        );

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      box-shadow:

        inset
        0 1px 2px
        rgba(255,255,255,0.35),

        0 25px 70px
        rgba(0,0,0,0.40),

        0 0 45px
        rgba(140,80,255,0.12);
    }


    /* =========================================
       MONTH
       ========================================= */

    #month {

      font-size: 13px;

      letter-spacing: 2px;

      opacity: 0.58;

      margin-bottom: 25px;
    }


    /* =========================================
       MESSAGE
       ========================================= */

    #message {

      font-size:
        clamp(
          24px,
          5vw,
          35px
        );

      line-height: 1.45;

      font-weight: 500;

      margin-bottom: 30px;

      text-shadow:

        0 0 15px
        rgba(255,255,255,0.18);
    }


    /* =========================================
       SMALL TEXT
       ========================================= */

    #smallText {

      font-size: 14px;

      opacity: 0.52;

      margin-bottom: 25px;
    }


    /* =========================================
       MESSAGE BUTTONS
       ========================================= */

    .buttons {

      display: flex;

      flex-direction: column;

      gap: 12px;

      align-items: center;
    }


    #shareBtn {

      background:

        rgba(
          255,
          255,
          255,
          0.10
        );

      border:

        1px solid
        rgba(
          255,
          255,
          255,
          0.20
        );

      box-shadow: none;
    }


    /* =========================================
       HIDDEN
       ========================================= */

    .hidden {

      display: none !important;
    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 520px) {

      .container {

        padding:
          30px 15px;
      }


      #title {

        font-size: 39px;

        letter-spacing: 2px;
      }


      #subtitle {

        font-size: 16px;

        margin-bottom: 25px;
      }


      #languageBox {

        gap: 12px;

        max-width: 430px;
      }


      .languageBtn {

        min-height: 92px;

        border-radius: 22px;

        font-size: 15px;
      }


      .languageBtn::after {

        border-radius: 21px;
      }


      .languageBtn .flag {

        font-size: 27px;
      }


      #messageBox {

        padding:
          30px 18px;

        border-radius: 25px;
      }


      #message {

        font-size: 24px;
      }

    }


    /* =========================================
       VERY SMALL PHONES
       ========================================= */

    @media (max-width: 350px) {

      #languageBox {

        grid-template-columns:
          1fr;
      }


      #chooseLanguage {

        grid-column:
          auto;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       STAR BACKGROUND
       ========================================= -->

  <div class="stars"></div>


  <!-- =========================================
       MAIN
       ========================================= -->

  <main class="container">


    <div class="logo">
      Universe139
    </div>


    <h1 id="title">
      MESSAGE FROM<br>
      THE UNIVERSE
    </h1>


    <p id="subtitle">
      You were guided here for a reason.
    </p>


    <!-- =========================================
         LANGUAGE SELECTION
         ========================================= -->

    <div id="languageBox">


      <div id="chooseLanguage">
        Choose your language
      </div>


      <!-- ENGLISH -->

      <button
        class="languageBtn"
        data-language="en"
        type="button"
      >

        <span class="flag">
          🇺🇸
        </span>

        English

      </button>


      <!-- SPANISH -->

      <button
        class="languageBtn"
        data-language="es"
        type="button"
      >

        <span class="flag">
          🇪🇸
        </span>

        Español

      </button>


      <!-- CHINESE -->

      <button
        class="languageBtn"
        data-language="zh"
        type="button"
      >

        <span class="flag">
          🇨🇳
        </span>

        中文

      </button>


      <!-- RUSSIAN -->

      <button
        class="languageBtn"
        data-language="ru"
        type="button"
      >

        <span class="flag">
          🇷🇺
        </span>

        Русский

      </button>


      <!-- HINDI -->

      <button
        class="languageBtn"
        data-language="hi"
        type="button"
      >

        <span class="flag">
          🇮🇳
        </span>

        हिन्दी

      </button>


      <!-- THAI -->

      <button
        class="languageBtn"
        data-language="th"
        type="button"
      >

        <span class="flag">
          🇹🇭
        </span>

        ไทย

      </button>


    </div>


    <!-- =========================================
         REVEAL BUTTON
         ========================================= -->

    <button
      id="revealBtn"
      class="hidden"
      type="button"
    >
      ✨ REVEAL MY MESSAGE
    </button>


    <!-- =========================================
         LOADING
         ========================================= -->

    <div
      id="loading"
      class="hidden"
    >

      <div id="loadingText">
        Connecting to the universe...
      </div>

    </div>


    <!-- =========================================
         MESSAGE
         ========================================= -->

    <section
      id="messageBox"
      class="hidden"
    >


      <div id="month">
        YOUR MESSAGE FOR
      </div>


      <div id="message">
      </div>


      <div id="smallText">
        Keep this message close to your heart.
      </div>


      <div class="buttons">


        <button
          id="againBtn"
          type="button"
        >
          🔮 RECEIVE ANOTHER MESSAGE
        </button>


        <button
          id="shareBtn"
          type="button"
        >
          ✨ SHARE
        </button>


      </div>


    </section>


  </main>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script src="script.js"></script>


</body>

</html>
