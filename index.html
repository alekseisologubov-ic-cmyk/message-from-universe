  <!-- ====================================================
       TRUE MOVING BACKGROUND VIDEO
       IMPORTANT:
       - autoplay: starts automatically
       - muted: required for autoplay in modern browsers
       - loop: repeats continuously
       - playsinline: keeps video inline on mobile
       ==================================================== -->
  <video
    id="backgroundVideo"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline="true"
    preload="auto"
    aria-hidden="true"
  >
    <source src="universe-background.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

        <button class="languageBtn" data-language="de" type="button">Deutsch</button>

        <button class="languageBtn" data-language="it" type="button">Italiano</button>
      </div>
    </section>

    <!-- Main title -->
    <header>
      <div class="moon" aria-hidden="true">✦</div>

      <h1 id="title">A Message From The Universe</h1>

        Your message is waiting...
      </div>
    </header>

    <!-- Existing crystal-ball loading/reveal area -->
    <section

      <div id="ballHurricane" aria-hidden="true"></div>

    <section id="loading" class="hidden" aria-live="polite">

    <button
      id="revealBtn"

    </button>

    <!-- ==================================================
         MESSAGE CARD
         Only the message + Share remain here.
         Subscribe is removed from the card by JS/CSS.

    <article
      id="messageBox"
      class="message-box hidden"
      aria-live="polite"
    >
      <div id="month" class="month">Your Message</div>

        id="shareBtn"

      id="againBtn"

    <!-- Existing dynamic subscription system uses this variable.

    <div id="universe139SubscriptionMount" aria-hidden="true"></div>

  </main>

  <!-- ====================================================
       BACKGROUND VIDEO PLAYBACK SAFETY
       ==================================================== -->
  <script>
    (function () {
      const video = document.getElementById("backgroundVideo");

      if (!video) {
        return;
      }

      video.muted = true;
      video.defaultMuted = true;
      video.loop = true;
      video.playsInline = true;

      function startBackgroundVideo() {
        const promise = video.play();

        if (promise && typeof promise.catch === "function") {
          promise.catch(function (error) {
            console.warn(
              "Universe139 background video autoplay was blocked:",
              error
            );
          });
        }
      }

      if (video.readyState >= 2) {
        startBackgroundVideo();
      } else {
        video.addEventListener(
          "loadeddata",
          startBackgroundVideo,
          { once: true }
        );
      }

      video.addEventListener(
        "canplay",
        startBackgroundVideo,
        { once: true }
      );

      document.addEventListener(
        "visibilitychange",
        function () {
          if (!document.hidden) {
            startBackgroundVideo();
          }
        }
      );

    })();
  </script>

  <!-- Mobile playback reliability -->
  <script>
    (function () {
      const video = document.getElementById("backgroundVideo");
      if (!video) return;

      video.muted = true;
      video.defaultMuted = true;
      video.autoplay = true;
      video.loop = true;
      video.playsInline = true;

      function tryPlay() {
        if (document.hidden) return;
        try {
          const result = video.play();
          if (result && typeof result.catch === "function") {
            result.catch(function () {});
          }
        } catch (e) {
          // Browser may require a gesture; listeners below retry.
        }
      }

      tryPlay();
      video.addEventListener("loadedmetadata", tryPlay, { once: true });
      video.addEventListener("loadeddata", tryPlay, { once: true });
      video.addEventListener("canplay", tryPlay, { once: true });
      window.addEventListener("pageshow", tryPlay);
      window.addEventListener("focus", tryPlay);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) tryPlay();
      });

      ["touchstart", "pointerdown", "click"].forEach(function (eventName) {
        document.addEventListener(eventName, tryPlay, {
          passive: true
        });
      });
    })();
  </script>

  <!-- Move the dynamically-created subscription outside the message card on mobile -->
  <script>
    (function () {
      const mount = document.getElementById("universe139SubscriptionMount");
      if (!mount) return;

      function moveSubscriptionForMobile() {
        const box = document.getElementById("universe139SubscribeBox");
        if (!box) return;

        if (window.matchMedia("(max-width: 600px)").matches) {
          if (box.parentElement !== mount) {
            mount.appendChild(box);
          }
        }
      }

      const observer = new MutationObserver(moveSubscriptionForMobile);
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });

      moveSubscriptionForMobile();
      window.addEventListener("resize", moveSubscriptionForMobile);
    })();
  </script>

  <!-- Existing application logic -->
  <script src="script.js"></script>

  <!-- Keep the parchment design active for every revealed message -->
  <script>
    (function installUniverse139StableParchmentView() {
      const BODY_CLASS = "universe139ParchmentMode";
      let parchmentSessionStarted = false;

      function getMessageElements() {
        return {
          box: document.getElementById("messageBox"),
          message: document.getElementById("message"),
          title: document.getElementById("title"),
          video: document.getElementById("backgroundVideo")
        };
      }

      function applyTextSizes(messageElement, titleElement) {
        if (messageElement) {
          const length = String(messageElement.textContent || "").trim().length;

          messageElement.dataset.parchmentSize =
            length > 185
              ? "very-long"
              : length > 120
                ? "long"
                : "normal";
        }

        if (titleElement) {
          const titleLength = String(titleElement.textContent || "").trim().length;

          titleElement.dataset.parchmentTitle =
            titleLength > 27 ? "long" : "normal";
        }
      }

      function hasGeneratedMessage(messageElement) {
        return Boolean(
          messageElement &&
          String(messageElement.textContent || "").trim()
        );
      }

      function keepBackgroundVideoPlaying(video) {
        if (!video || document.hidden) {
          return;
        }

        try {
          const playback = video.play();

          if (playback && typeof playback.catch === "function") {
            playback.catch(function () {});
          }
        } catch (error) {
          // A mobile browser may wait for another user gesture.
        }
      }

      function activateParchmentImmediately() {
        parchmentSessionStarted = true;
        document.body.classList.add(BODY_CLASS);

        const { message, title, video } = getMessageElements();
        applyTextSizes(message, title);
        keepBackgroundVideoPlaying(video);
      }

      function refreshParchmentView() {
        const { message, title, video } = getMessageElements();

        applyTextSizes(message, title);

        /*
          IMPORTANT:
          Start parchment mode as soon as a real message exists, and never
          turn it off while another message is loading. The original script
          temporarily hides #messageBox between messages. Removing the body
          class during that moment caused the old purple design to reappear.
        */
        if (hasGeneratedMessage(message)) {
          parchmentSessionStarted = true;
        }

        if (parchmentSessionStarted) {
          document.body.classList.add(BODY_CLASS);
        }

        keepBackgroundVideoPlaying(video);
      }

      function wrapMessageFunctions() {
        if (
          typeof window.showMessage === "function" &&
          !window.showMessage.__universe139StableParchmentWrapped
        ) {
          const originalShowMessage = window.showMessage;

          const wrappedShowMessage = function () {
            /* Add the new design BEFORE the old message box is made visible. */
            activateParchmentImmediately();

            const result = originalShowMessage.apply(this, arguments);
            refreshParchmentView();
            return result;
          };

          wrappedShowMessage.__universe139StableParchmentWrapped = true;
          window.showMessage = wrappedShowMessage;
        }

        if (
          typeof window.receiveAnotherMessage === "function" &&
          !window.receiveAnotherMessage.__universe139StableParchmentWrapped
        ) {
          const originalReceiveAnotherMessage = window.receiveAnotherMessage;

          const wrappedReceiveAnotherMessage = function () {
            /* Keep the parchment visible during the complete next-message cycle. */
            activateParchmentImmediately();
            return originalReceiveAnotherMessage.apply(this, arguments);
          };

          wrappedReceiveAnotherMessage.__universe139StableParchmentWrapped = true;
          window.receiveAnotherMessage = wrappedReceiveAnotherMessage;
        }
      }

      function initializeParchmentView() {
        const { box, message, title } = getMessageElements();

        if (!box || !message) {
          return;
        }

        wrapMessageFunctions();

        const observer = new MutationObserver(refreshParchmentView);

        observer.observe(box, {
          attributes: true,
          attributeFilter: ["class", "style"],
          childList: true,
          subtree: true
        });

        observer.observe(message, {
          characterData: true,
          childList: true,
          subtree: true
        });

        if (title) {
          observer.observe(title, {
            characterData: true,
            childList: true,
            subtree: true
          });
        }

        window.addEventListener("resize", refreshParchmentView);
        window.addEventListener("pageshow", refreshParchmentView);
        document.addEventListener("visibilitychange", refreshParchmentView);

        /* One extra mobile-safe refresh after the page finishes settling. */
        window.setTimeout(function () {
          wrapMessageFunctions();
          refreshParchmentView();
        }, 250);

        refreshParchmentView();
      }

      if (document.readyState === "loading") {
        document.addEventListener(
          "DOMContentLoaded",
          initializeParchmentView,
          { once: true }
        );
      } else {
        initializeParchmentView();
      }
    })();
  </script>
