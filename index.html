<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Message From The Universe</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

  <div class="stars"></div>

  <main class="container">

    <div class="moon">☾</div>

    <h1 id="title">
      MESSAGE FROM<br>THE UNIVERSE
    </h1>

    <p class="subtitle" id="subtitle">
      You were guided here for a reason.
    </p>

    <!-- LANGUAGE SELECTION -->

    <div id="languageBox" class="language-box">

      <p class="choose-language" id="chooseLanguage">
        Choose your language
      </p>

      <div class="languages">

        <button class="languageBtn" data-language="en">
          🇺🇸 English
        </button>

        <button class="languageBtn" data-language="es">
          🇪🇸 Español
        </button>

        <button class="languageBtn" data-language="zh">
          🇨🇳 中文
        </button>

        <button class="languageBtn" data-language="ru">
          🇷🇺 Русский
        </button>

      </div>

    </div>

    <!-- CRYSTAL -->

    <div class="crystal">🔮</div>

    <!-- REVEAL -->

    <button id="revealBtn" class="hidden">
      ✨ REVEAL MY MESSAGE
    </button>

    <!-- LOADING -->

    <div id="loading" class="loading hidden">

      <div class="spinner"></div>

      <p id="loadingText">
        Connecting to the universe...
      </p>

    </div>

    <!-- MESSAGE -->

    <div id="messageBox" class="message-box hidden">

      <div class="month" id="month"></div>

      <p id="message"></p>

      <div class="divider">
        ✦ ✧ ✦
      </div>

      <p class="small-text" id="smallText">
        Keep this message close to your heart.
      </p>

      <button id="againBtn">
        🔮 RECEIVE ANOTHER MESSAGE
      </button>

      <button id="shareBtn">
        ✨ SHARE
      </button>

    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
