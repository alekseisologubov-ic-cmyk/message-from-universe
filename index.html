<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Message From The Universe</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

  <div class="stars"></div>

  <main class="container">

    <div class="moon">☾</div>

    <h1>MESSAGE FROM<br>THE UNIVERSE</h1>

    <p class="subtitle">
      You were guided here for a reason.
    </p>

    <div class="crystal">🔮</div>

    <button id="revealBtn">
      ✨ REVEAL MY MESSAGE
    </button>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Connecting to the universe...</p>
    </div>

    <div id="messageBox" class="message-box hidden">

      <div class="month" id="month"></div>

      <p id="message"></p>

      <div class="divider">✦ ✧ ✦</div>

      <p class="small-text">
        Keep this message close to your heart.
      </p>

      <button id="againBtn">
        🔮 RECEIVE ANOTHER MESSAGE
      </button>

      <button id="shareBtn">
        ✨ SHARE
      </button>

    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
